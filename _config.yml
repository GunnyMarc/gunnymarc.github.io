theme: jekyll-theme-chirpy
lang: en
timezone: America/New_York

title: "Semper ex Datis"
tagline: "Always from Data"
description: 'U.S. Marine | Data Scientist where it counts! CxO interpreter, techie-whisperer, and non-corporate clone. "Experience is directly & exponentially proportional to the amount of code refactored" — Everyone who has coded'

url: "https://gunnymarc.github.io"
baseurl: ""

github:
  username: GunnyMarc

social:
  name: "Marc Buraczynski"
  email: ""
  links:
    - https://github.com/GunnyMarc
    - https://www.linkedin.com/in/marc-buraczynski

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:

pageviews:
  provider:

theme_mode:

cdn: ""

avatar: "/images/semper-ex-datis-avatar.jpg"

social_preview_image:

toc: true

comments:
  provider:

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - AGENTS.md
  - CLAUDE.md
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - "package*.json"
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git

plugins:
  - jekyll-redirect-from
  - jekyll-archives
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap

jekyll-archives:
  enabled: [tags]
  layouts:
    tag: tag
  permalinks:
    tag: /tags/:name/

future: true

